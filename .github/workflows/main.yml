name: Open link

on:
  workflow_dispatch:      # lets you run it manually with a button
  schedule:
    - cron: "0 * * * *"   # optional: every hour

jobs:
  open-link:
    runs-on: ubuntu-latest
    steps:
      - name: Request the public link
        run: curl -L -s -o /dev/null -w "Status: %{http_code}\n" "https://example.com"
